<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>随译 SuiYi</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<style>
  /* 无边框窗口：顶部一条自绘标题栏（拖拽 + 窗口按钮），与主界面一致 */
  .titlebar{position:fixed;top:0;left:0;right:0;height:38px;display:flex;align-items:center;
       padding:0 12px 0 20px;background:#f5f6fa;border-bottom:1px solid #e5e6eb;z-index:10;
       --wails-draggable:drag;user-select:none}
  .titlebar .tb-title{font-size:12px;color:#8a9099;flex:1}
  .tb-btns{display:flex;gap:2px;--wails-draggable:no-drag}
  .tb-btn{width:40px;height:28px;border:none;border-radius:6px;background:transparent;color:#646a73;
       font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tb-btn:hover{background:#eef1f6;color:#1f2329}
  .tb-btn svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.4}
  .tb-close:hover{background:#e81123;color:#fff}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#646a73;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  div{text-align:center;max-width:440px}
  .logo{width:56px;height:56px;line-height:56px;margin:0 auto 16px;border-radius:14px;
       background:linear-gradient(135deg,#3370ff,#00b42a);color:#fff;font-size:26px;font-weight:700}
  h2{color:#1f2329;margin:0 0 8px;font-weight:600}
  p{font-size:14px;line-height:1.7;word-break:break-all}
  button{margin-top:14px;padding:8px 20px;border:none;border-radius:8px;background:#3370ff;color:#fff;
        font-size:14px;cursor:pointer;display:none}
  code{background:#eef1f6;border-radius:4px;padding:1px 6px;font-size:13px}
</style>
</head>
<body>
<div class="titlebar">
  <span class="tb-title">随译 SuiYi</span>
  <span class="tb-btns">
    <button class="tb-btn" id="tbMin" title="最小化"><svg viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6"/></svg></button>
    <button class="tb-btn" id="tbMax" title="最大化 / 还原"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg></button>
    <button class="tb-btn tb-close" id="tbClose" title="关闭"><svg viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></button>
  </span>
</div>
<div>
  <div class="logo">译</div>
  <h2>随译 SuiYi</h2>
  <p id="msg">正在连接本地翻译服务…</p>
  <button id="retry">重 试</button>
</div>
<script>
/* 本地服务地址由 Go 端注入（端口可配置，绝不写死 8848）：
   首页只做一件事——探测服务就绪后跳到 Web 管理界面。
   探测用 no-cors 模式：跨端口探测不需要服务端配 CORS，连不上会 reject，
   能连上就 resolve（不读响应体），因此只用来判断"服务起没起来"。 */
(function(){
  var API = "__SUIYI_API_URL__";
  var msg = document.getElementById('msg'), retry = document.getElementById('retry');
  var tries = 0;

  function fail(html){ msg.innerHTML = html; retry.style.display = 'inline-block'; }

  // 注入失败时的兜底：问 Wails 绑定要地址（理论上不会走到这里）
  function viaBinding(){
    if (window.go && window.go.main && window.go.main.App && window.go.main.App.GetAPIURL) {
      window.go.main.App.GetAPIURL().then(function(u){ window.location.replace(u); })
        .catch(function(){ fail('未能从应用获取本地服务地址，请重新启动随译。'); });
      return true;
    }
    return false;
  }

  function connect(){
    if (!API || API.indexOf('http') !== 0) {
      if (!viaBinding()) fail('未能获取本地服务地址，请重新启动随译。');
      return;
    }
    tries++;
    fetch(API + 'health', {mode:'no-cors', cache:'no-store'}).then(function(){
      window.location.replace(API);   // 服务已就绪 → 进管理界面
    }).catch(function(e){
      if (tries < 60) {               // 最多等约 30 秒（服务/引擎还在启动）
        if (tries > 1) msg.textContent = '正在连接本地服务…（第 ' + tries + ' 次）';
        setTimeout(connect, 500);
      } else {
        fail('连不上本地服务 <code>' + API + '</code><br>' + (e && e.message ? e.message : e) +
             '<br><br>请确认随译服务已启动、端口未被占用；也可直接用浏览器打开上面的地址。');
      }
    });
  }

  retry.onclick = function(){
    tries = 0; retry.style.display = 'none';
    msg.textContent = '正在连接本地翻译服务…';
    connect();
  };
  connect();
})();
  // 窗口按钮（runtime 由 Wails asset server 自动注入到本页）
  if(window.runtime){
    document.getElementById('tbMin').onclick = () => window.runtime.WindowMinimise();
    document.getElementById('tbMax').onclick = () => window.runtime.WindowToggleMaximise();
    document.getElementById('tbClose').onclick = () => window.runtime.WindowHide();
    document.querySelector('.titlebar').addEventListener('dblclick', e => {
      if(e.target.closest('button')) return;
      window.runtime.WindowToggleMaximise();
    });
  }
</script>
</body>
</html>
