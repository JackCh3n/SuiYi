<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>随译 SuiYi</title>
<style>
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#646a73;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  div{text-align:center}
  .logo{width:56px;height:56px;line-height:56px;margin:0 auto 16px;border-radius:14px;
       background:linear-gradient(135deg,#3370ff,#00b42a);color:#fff;font-size:26px;font-weight:700}
  h2{color:#1f2329;margin:0 0 8px;font-weight:600}
  p{font-size:14px}
</style>
</head>
<body>
<div>
  <div class="logo">译</div>
  <h2>随译 SuiYi</h2>
  <p>正在启动本地翻译服务…</p>
</div>
<script>
  function go(url){
    if (url) window.location.replace(url);
    else document.querySelector('p').textContent = '服务启动失败，请检查日志';
  }
  if (window.go && window.go.main && window.go.main.App && window.go.main.App.GetAPIURL) {
    window.go.main.App.GetAPIURL().then(go).catch(function(){ go('http://127.0.0.1:8848/'); });
  } else {
    setTimeout(function(){ go('http://127.0.0.1:8848/'); }, 400);
  }
</script>
</body>
</html>
